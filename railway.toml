# Railway config-as-code: HOW Railway builds and runs the service.
# The image itself is defined by the Dockerfile (Tailscale + app + migrations).
# Not configurable here — set in the Railway dashboard (see .local/prod-deploy.md):
#   volume at /var/lib/tailscale, environment variables, networking (no public domain).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: the Dockerfile's CMD (scripts/start.sh) does
# tailscale up → tailscale serve → migrations → app.

# No healthcheckPath on purpose: the app listens on 127.0.0.1 inside the container
# (only `tailscale serve` reaches it), so Railway's probe could never connect and
# every deploy would be marked failed. A broken start fails loudly anyway (set -e).

# Crash → restart. A failing migration exits non-zero too, so cap the retries.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
